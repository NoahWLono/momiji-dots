#
# /etc/pacman.conf
#
# Momiji Arch Linux pacman configuration
#

[options]

# Paths
#RootDir     = /
#DBPath      = /var/lib/pacman/
#CacheDir    = /var/cache/pacman/pkg/
#LogFile     = /var/log/pacman.log
#GPGDir      = /etc/pacman.d/gnupg/
#HookDir     = /etc/pacman.d/hooks/

# Protect pacman and glibc from accidental removal/upgrades
HoldPkg = pacman glibc

# Native architecture
Architecture = auto

# ------------------------------------------------------------
# MOMIJI PACMAN RICE
# ------------------------------------------------------------

# Colored pacman output
Color

# THE IMPORTANT ONE
# Turns the download progress bar into Pac-Man eating pellets
ILoveCandy

# Show package/version/size tables
VerbosePkgLists

# Check free disk space before package transactions
CheckSpace

# Download several packages concurrently
ParallelDownloads = 5

# ------------------------------------------------------------
# SECURITY / DOWNLOAD SANDBOX
# ------------------------------------------------------------

# Current Arch pacman download sandbox user
DownloadUser = alpm

# Keep sandboxing enabled
#DisableSandbox
#DisableSandboxFilesystem
#DisableSandboxSyscalls

# ------------------------------------------------------------
# PACKAGE CONTROL
# ------------------------------------------------------------

#IgnorePkg   =
#IgnoreGroup =

#NoUpgrade   =
#NoExtract   =

# ------------------------------------------------------------
# SIGNATURE VERIFICATION
# ------------------------------------------------------------

SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required


# ============================================================
# OFFICIAL ARCH REPOSITORIES
# ============================================================

#[core-testing]
#Include = /etc/pacman.d/mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist


#[extra-testing]
#Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist


# ------------------------------------------------------------
# MULTILIB
#
# Leave this commented unless you need 32-bit software.
# Steam/Wine users frequently enable it.
# ------------------------------------------------------------

#[multilib-testing]
#Include = /etc/pacman.d/mirrorlist

#[multilib]
#Include = /etc/pacman.d/mirrorlist


# ============================================================
# CUSTOM REPOSITORIES
# ============================================================

# Add custom repositories below this line only if intentionally
# configured.
#
# Example:
#
#[custom]
#SigLevel = Optional TrustAll
#Server = file:///home/custompkgs
